{{- with .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Values.ingress.name }}
  namespace: {{ $.Values.ingress.namespace }}
  annotations:

  {{- range $key, $value := .Values.ingress.annotations }}
  {{ $key }}: {{ $val }}
  {{- end }} 

spec:
  ingressClassName: {{ $.Values.className }}
  tls:
    - hosts:
        - smallboy.danklofan.com
      secretName: smallboy-tls  # Will be created by cert-manager
  rules:
    - host: smallboy.danklofan.com
      http:
        paths:
         {{- range $key,$value := .Values.ingress.paths}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
{{- end }}
name: sb-ci
on: 
  push:
    branches:
        - k8s-resources
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
         - uses: actions/checkout@v5

         - name: login docker
           uses: docker/login-action@v3
           with:
             username: ${{ secrets.DOCKERHUB_USERNAME }}
             password: ${{ secrets.DOCKERHUB_TOKEN }}

         - name: build and push frontend image
           uses: docker/build-push-action@v6
           with: 
             context: ./client
             push: true
             tags: |
                ${{ secrets.DOCKERHUB_USERNAME }}/smallboy-client:latest
                ${{ secrets.DOCKERHUB_USERNAME }}/smallboy-client:${{ github.sha }}
        
         - name: build and push backend image
           uses: docker/build-push-action@v6
           with:
            context: ./server
            push: true
            tags: |
                ${{ secrets.DOCKERHUB_USERNAME }}/smallboy-server:latest
                ${{ secrets.DOCKERHUB_USERNAME }}/smallboy-server:${{ github.sha }}

# deploying on GKE cluster
    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout repo
              uses: actions/checkout@v5

              # Authenticate with GCP

            - name: Authenticate to GCP
              uses: google-github-actions/auth@v3
              with:
                 credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
            
            - name: Get GKE credentials
              uses: google-github-actions/get-gke-credentials@v3
              with:
                cluster_name: autopilot-cluster-1
                location: us-central1
                project_id: natural-motif-469318-d4
    #---Install Helm
            - name: install helm
              uses: azure/setup-helm@v4



    #-----Deploy using HElm
            - name: deploy using helm
              run: |
                    helm upgrade --install smallboy ./smallboy \
                    --namespace sb-ns \
                    --create-namespace \
                    --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/smallboy-client \
                    --set frontend.image.tag=${{ github.sha }} \
                    --set backend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/smallboy-server \
                    --set backend.image.tag=${{ github.sha }}


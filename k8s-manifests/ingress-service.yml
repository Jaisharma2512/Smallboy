apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smallboy-ingress
  namespace: sb-ns
  annotations:
    kcert.dev/ingress: "managed"
    kcert.dev/solver-ingress-port: "80"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - smallboy.danklofan.com
      secretName: smallboy-tls  # Will be created by cert-manager
  rules:
    - host: smallboy.danklofan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
